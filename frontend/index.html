<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chatrooms</title>
  </head>
  <body>
    <!--
      This is the ONLY html file. It is almost empty on purpose.

      <div id="root"> is a hook for React to attach to — the browser renders an empty
      page, then the script below fills that div in. Everything you see on screen is
      created by JavaScript at runtime, not written here.

      The <script type="module" src="/src/main.tsx"> line is what Vite serves. A browser
      cannot run .tsx, so in development Vite strips the types on the fly, and for a
      production build it compiles everything into plain .js first.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
